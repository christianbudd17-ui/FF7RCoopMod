; =====================================================================
; READY-MADE SETTINGS: Vanilla difficulty (every other setting = the mod's default)
; To use it without the settings app: copy this file next to xinput1_3.dll (End\Binaries\Win64),
;   delete or rename the old FF7RCoopMod.ini there, and rename this file to FF7RCoopMod.ini.
; With the settings app: leave it in FF7RCoopMod_Profiles and pick it under Profiles.
;
; =====================================================================
; FF7 Remake co-op mod settings
; Edit with Notepad or the settings app, save, then press F6 in game (ReloadKey) - or restart the game:
;   some settings only change at a restart (see ReloadKey below). Lines starting with ; are notes.
; Delete this file to get the defaults back (it is re-created on the next launch).
;
; Controller button names: A B X Y LB RB LT RT L3 R3 Start Back
;                          DPadUp DPadDown DPadLeft DPadRight None
;   Several buttons for one action: separate with commas, e.g.  LB, LT
; Keyboard key names: Up Down Left Right Enter Escape Space Tab Backspace,
;   single letters/digits (Z, X, 1), F1-F12, Num0-Num9
; Which controller each player uses: [Input2] at the end of this file (Auto = the mod picks).
; =====================================================================

[General]
; Mod hotkeys only work in normal play (walking around or fighting), never in menus, pause
;   screens or cutscenes - the game uses F1-F8 in its menus. Keep them off Ctrl/Alt/Shift:
;   those guard, dash and open shortcuts in this game. None = no key.
; Key that makes player 2 join or leave
JoinKey=F10
; Hot swap keys: the person who started as player 1 / 2 / 3 takes the lead (the party
;   leader, main menu, chests) and trades characters with whoever leads right now. Each
;   person keeps their own controller. Keyboard only (player 1's decision). The keyboard
;   always drives the leader, so player 1 should be on a controller to play a teammate.
LeadKeyPlayer1=F9
LeadKeyPlayer2=Ctrl+F9
LeadKeyPlayer3=Shift+F9
; Key that re-reads this file while the game runs (change settings without restarting).
;   These need a restart: [Input2] SeatN (which controller / player 3 on or off),
;   JoinAtStart and the split screen's Enabled / Show.
ReloadKey=F6
; Key that shows / hides a list of all the co-op keys and controller buttons on screen
HelpKey=F5
; 1 = show the frame rate at the top of the screen
ShowFPS=0
; 1 = show the PC's clock (the same time as the log lines) in the top right corner - for noting times while testing
ShowClock=0
; Own command menus: 1 = after players 2/3 give a command in their own menu it closes (the game would turn it to player 1's page and leave it open), 0 = off
OwnMenuCloseAfterCommand=1
; 1 = while the leader plays on the keyboard, the hot swap keys do nothing (the keyboard only works for the
;   leader, so a swap would leave that player watching the AI - default); 0 = hot swap always works
KeyboardLeaderKeepsLead=1
; Auto = player 2 starts joined if their controller is connected (or joins as soon as it connects); 0 = press
;   JoinKey / hold JoinButton first
JoinAtStart=Auto
; 1 = show players 2/3's target markers (P2 green, P3 orange)
ShowTargetMarker=1
; 1 = show the P2/P3 badges in the top-right corner (diamonds: "PLAYER" in the player's color = a person
;   is playing that character, red "AI" = the game's AI is, faded gray = no character in that slot)
ShowStatusCircles=1
; Where they sit: distance in from the right edge and down from the top (pixels at 1080p),
;   and a size multiplier. Raise StatusCirclesTop if they cover the minimap.
StatusCirclesRight=12
StatusCirclesTop=12
StatusCirclesSize=0.5
; 1 = when player 2 is off screen, show a circle at the screen edge in their direction.
;   The arrow inside it is the way player 2 is facing (pointing back toward the middle of the
;   screen = coming back into view, pointing outward = heading further away).
ShowOffscreenArrow=1
; 1 = while player 2 or 3 is in, the AI teammates guard when player 1 guards (like the normal
;   game does on its own). 0 = off.
AIGuardCopy=1

[Camera]
; Shared co-op camera. It keeps both players and their current targets in view, adds other
; nearby enemies when that's cheap, zooms out as needed and tilts down toward an overhead view
; as everything spreads out. Player 1 still turns the camera. Distances: game units (~1 cm).
Enabled=1
; Key to switch the co-op camera on/off while playing (to compare with the normal camera)
ToggleKey=F8
; (While the split-screen windows (F7) show, each player has their own view and the co-op camera is off.)
; Side-by-side split screen: 1 = while player 1 is locked on, the game's lock-on view is centred in player 1's half (0 = player 1 always in the middle of their half)
SplitAimFollowsLockOn=1
; With SplitAimFollowsLockOn: 1 = turn toward the locked-on enemy only as far as player 1 stays in their part of the
;   screen (the enemy may sit off centre), 0 = the enemy always in the middle (player 1 can leave the view)
SplitAimLockKeepsPlayer1=1
; With SplitAimFollowsLockOn: 1 = player 1's view widens (up to +60%, at most 110 degrees) when needed so the locked-on
;   enemy can stay centred with player 1 still in view; 0 = never changes player 1's field of view
SplitAimLockZoom=1
; Side-by-side split: 1 = player 1's view is moved into their part with an off-centre lens (no squeeze at
;   the screen edge, best for thirds); 0 = the camera is turned instead (the old way)
SplitLens=1
; Where the camera aims: 0.0 = on player 1, 1.0 = the middle of everything being framed
Bias=0.4
; The closest the camera gets to player 1 (cm; 800 = 8 m)
BaseZoomOut=800
; Farthest the camera may pull back
MaxDistance=3500
; How much of the screen the framed characters may use (0.8 = keep a border around them)
ScreenMargin=0.6
; Steepest downward angle when everything is spread out (degrees; 90 = straight down)
MaxTilt=35
; The camera starts tilting down when things are this spread out...
TiltStartSpread=800
; ...and reaches MaxTilt at this spread
TiltFullSpread=3000
; Other enemies (not anyone's current target) within this distance of player 1 are framed too...
EnemyRadius=2500
; ...but only if that pulls the camera back by no more than this fraction (0.25 = 25% more)
EnemyExtraAllowance=0.25
; How quickly the camera eases into its new position (higher = snappier, lower = floatier)
Smoothing=3.0
; If the game's own camera is further than this from player 1, it's a scripted shot or
;   cutscene: the co-op camera stays out of it (it also stays out of real cutscenes)
CutsceneDistance=3000
; 1 = during talking scenes and cinematic shots (the game takes away the field controls, or narrows its camera) the co-op camera
;   and the split screen step aside for the game's own camera, 0 = they stay on
TalkScenes=1
; 1 = move the camera in front of walls/ceilings that would block the view (characters, enemies and props are ignored), 0 = off
WallCheck=1
; If even MaxDistance can't fit everyone, slowly turn the camera to look from behind player 1
;   toward player 2, and turn back when they come together. Grabbing the camera cancels it.
AutoOrient=1
; How fast it turns, in degrees per second
AutoOrientSpeed=60

[PictureInPicture]
; A small second view that follows player 2 (picture-in-picture). It draws the game a second
;   time, so it costs frame rate: leave it off if your PC struggles.
; 1 = on when the game starts, 0 = off (ToggleKey can still switch it on while playing)
Enabled=1
ToggleKey=F7
; Key that switches where players 2 and 3 go (right -> left -> bottom -> top -> thirds), saved. None = no key.
LayoutKey=Ctrl+F7
; When to show it at the start: Always, or Battle (split screen only during battles; one shared
;   camera in the field). In game F7 cycles: always -> battle only -> off -> always.
Show=Battle
; Side: Left or Right (side-by-side split), or Top / Bottom (split across the middle,
;   player 2's view on top or bottom). The windows are always split screen (half the screen).
;   Thirds = three columns side by side, player 1 | player 2 | player 3 (for widescreen monitors;
;   halves with players 2/3 on the right until player 3 joins). Thirds needs ThirdsLayout=1.
Side=Right
; (Each window's camera is set per player: [Player2] / [Player3] Window... keys - see there.)
; --- Performance ---
; Detail: 1 = normal, higher = simpler models in the small view (faster)
Detail=1
; Don't draw things further away than this (game units, 0 = no limit). 5000-10000 helps slower PCs.
ViewDistance=0
; Each window camera draws a screen-sized picture (the game puts its own HUD into it, at normal size)
;   and only the window's part is shown. Its size in % of the screen (100 = sharpest, lower = faster). 25 - 100
FullSizeHudQuality=100
; Party health / ATB panel: Shared = the game's one panel at the bottom right of the screen; Individual = each player gets
;   it in their own part of the screen (battles, split screen). PartyPanelRows (Individual only): All = the whole party /
;   Own = just their own character / OwnAndAI = their own character + the AI-played teammates
PartyPanel=Individual
PartyPanelRows=OwnAndAI
; PartyPanelScale (Individual only): the panels' size in percent, 50 to 100, in a half-screen view; PartyPanelScaleThird /
;   PartyPanelScaleQuarter: the same in a third / quarter of the screen (the panel looks bigger in a smaller view)
PartyPanelScale=90
PartyPanelScaleThird=85
PartyPanelScaleQuarter=85
; CommandMenuScale / CommandMenuScaleThird / CommandMenuScaleQuarter: the command HUD, menus and shortcut palettes' size in
;   percent (50 - 100) in a half / third / quarter of the screen (split screen only; full screen = 100)
CommandMenuScale=90
CommandMenuScaleThird=85
CommandMenuScaleQuarter=85
; Dynamic quality: when the frame rate stays below DynamicTargetFps, the windows get plainer one step at a time (and better
;   again when there's room). DynamicOrder = what it lowers, first to last (Detail, DrawDistance, Sharpness, HalfRate - leave
;   one out to never touch it; HalfRate = the windows draw every other frame). The Lowest values are how far it may go.
;   Set DynamicTargetFps typically 5 - 10 fps lower than the game's own frame rate setting (e.g. 50 - 55 with the game at 60);
;   if it is higher than the game's setting, dynamic quality turns itself off.
DynamicQuality=0
DynamicTargetFps=55
DynamicOrder=Detail, DrawDistance, Sharpness, HalfRate
DynamicLowestDetail=4
DynamicLowestDrawDistance=4000
DynamicLowestSharpness=50
; EXPERIMENTAL: 1 = the Thirds layout can be used (Side=Thirds, and the layout key offers it); 0 = Thirds acts as Right
ThirdsLayout=0
; Thirds layout only: the command HUD / menus / shortcuts move this many pixels (at 1080p) to the LEFT, the health / ATB
;   panels this many to the RIGHT, to give each narrow column more room (0 - 300)
ThirdsCommandNudge=40
ThirdsPanelNudge=40
; The game's battle messages (an enemy defeated, Gil / EXP / items gained) go to the right edge of the screen (always),
;   then this many pixels (at 1080p) to the RIGHT / DOWN (minus = left / up): MessageLogX -1500 - 300, MessageLogY -600 - 600
MessageLogX=0
MessageLogY=0
; 1 = a window narrower than 16:9 (thirds, side-by-side halves) keeps the top-to-bottom view angle a 16:9 window would
;   have with its FOV, and gets narrower across instead (no fish-eye look); 0 = the FOV is always measured across
TallWindowFov=1
; 0 = no vignette (darkened edges) in the windows - each window shows a slice of a screen-sized picture, so the
;   game's vignette darkened the outer windows; 1 = keep the game's vignette
WindowVignette=0
; Brightness of the windows' picture in exposure steps added to the game's (-3 to 3; 1 = twice as bright, 0 = the game's)
WindowBrightness=0
; Advanced, only if the picture looks too dark / too bright / washed out:
;   CaptureSource 2 = finished image (normal), 0 = raw HDR. Format 2 = 8-bit, 5 = 16-bit float.
CaptureSource=2
Format=2

[Balance]
; How much the battle slows down while a command menu is open, in % of the game's own slowdown
;   (100 = the game's normal slowdown, 50 = half as much, 0 = no slowdown - time keeps running)
; MenuSlowdown = player 1's command menu, MenuSlowdownPlayer2 / MenuSlowdownPlayer3 = player 2's / player 3's
MenuSlowdown=100
MenuSlowdownPlayer2=100
MenuSlowdownPlayer3=100
; The game gives AI-run party members a slower ATB gauge and weaker stagger on normal attacks,
;   and enemies pay them less attention. 1 = characters played by a person get player 1's rates.
PlayerRulesForHumans=1
; ATB fill rate of each person's character, in % of the game's normal speed (0 = the AI's slower rules, at most 100).
;   Anything above 0 also gives players 2 / 3 player 1's stagger rate
;   on normal attacks. 90 = the Co-op Balanced default; 100 = the game's normal.
;   (These three are the fallback: each [Balance2] / [Balance3] / [BalanceGlobal] set can have its own; [Balance1] has its
;   own Player1Rates - player 1 alone - and without one it is 100, the game's normal.)
Player1Rates=90
Player2Rates=90
Player3Rates=90
; 1 = enemies treat characters played by a person like player 1's character (who to go after)
EnemiesTreatHumansLikePlayer1=1
; 1 = the enemy and command-menu settings follow how many people play ([Balance1] / [Balance2] / [Balance3]);
;   0 = the same for any number of people ([BalanceGlobal])
DynamicDifficulty=1

; ---- Enemy settings per party size (f1.151) ----
; [Balance1] = a one-character party, [Balance2] = two characters, [Balance3] = three. Percent; 100 / 0 / Off = the
;   game's normal. Defaults: [Balance1] = the game's normal, [Balance2] / [Balance3] = Co-op Balanced (a little tougher
;   enemies for more people playing). The mod picks the set when the party changes. During a battle it only steps UP
;   (someone joins / the story adds a person's character); anything else waits until the battle is over, so enemies'
;   health doesn't drop when a controller drops out.
; Each of these sections (and [BalanceGlobal]) can also hold MenuSlowdown / MenuSlowdownPlayer2 / MenuSlowdownPlayer3,
;   MenuDarken and MenuDarkenSplitPlayer1 / 2 / 3 - a missing one = the value in [Balance] / [General].
[Balance1]
; Enemy health: 150 = enemies have 50% more HP
EnemyHP=100
; Damage the party takes from enemies: 150 = 50% more, 75 = a quarter less
EnemyDamage=100
; How often enemies use their attacks / abilities: 200 = twice as often, 50 = half as often (movement unchanged)
EnemyAttackRate=100
; How fast enemies' stagger gauge fills: 80 = 20% slower to stagger, 120 = faster
StaggerRate=100
; Chance (%) that an enemy which lands a hit on the player it is after stays on that player for its next attack
;   (0 = the game's normal: enemies move on to someone else after almost every attack; 100 = always stays)
StayOnHitChance=0
; An enemy turns on a player who deals it this much damage within a few seconds (% of its max health), 0 = off
TurnOnHeavyDamage=0
; Enemies go after a weakened player: when an enemy picks a new target, the chance it goes for the weakest player
;   instead - Off (the game's normal), Low (25%), Medium (50%), High (75%), Extreme (always)
PreferWeakTargets=Off
; A player counts as weakened below this much of their max health (%): 20 = below a fifth, 50 = below half
WeakTargetHealth=20
Player1Rates=100
MenuSlowdown=100
MenuSlowdownPlayer2=100
MenuSlowdownPlayer3=100

[Balance2]
; 1 = only while 2 people play (player 1 + player 2 or 3); with an AI teammate instead, the [Balance1] settings are used
OnlyWithHumanPlayers=1
; Enemy health: 150 = enemies have 50% more HP
EnemyHP=100
; Damage the party takes from enemies: 150 = 50% more, 75 = a quarter less
EnemyDamage=100
; How often enemies use their attacks / abilities: 200 = twice as often, 50 = half as often (movement unchanged)
EnemyAttackRate=100
; How fast enemies' stagger gauge fills: 80 = 20% slower to stagger, 120 = faster
StaggerRate=100
; How much attention players 2 and 3 draw: 200 = enemies turn on them twice as readily (100 = the game's normal)
FocusOnPlayer2=100
; Chance (%) that an enemy which lands a hit on the player it is after stays on that player for its next attack
;   (0 = the game's normal: enemies move on to someone else after almost every attack; 100 = always stays)
StayOnHitChance=0
; An enemy turns on a player who deals it this much damage within a few seconds (% of its max health), 0 = off
TurnOnHeavyDamage=0
; Enemies go after a weakened player: when an enemy picks a new target, the chance it goes for the weakest player
;   instead - Off (the game's normal), Low (25%), Medium (50%), High (75%), Extreme (always)
PreferWeakTargets=Off
; A player counts as weakened below this much of their max health (%): 20 = below a fifth, 50 = below half
WeakTargetHealth=20
MenuSlowdown=100
MenuSlowdownPlayer2=100
MenuSlowdownPlayer3=100
Player1Rates=100
Player2Rates=100
Player3Rates=100

[Balance3]
; 1 = only while 3 people play; with AI teammates instead, the settings for the number of people playing are used
;   (2 people = [Balance2], player 1 alone = [Balance1])
OnlyWithHumanPlayers=1
; players' ATB speed with three characters (Co-op Balanced: 85)
Player1Rates=100
Player2Rates=100
Player3Rates=100
; Enemy health: 150 = enemies have 50% more HP
EnemyHP=100
; Damage the party takes from enemies: 150 = 50% more, 75 = a quarter less
EnemyDamage=100
; How often enemies use their attacks / abilities: 200 = twice as often, 50 = half as often (movement unchanged)
EnemyAttackRate=100
; How fast enemies' stagger gauge fills: 80 = 20% slower to stagger, 120 = faster
StaggerRate=100
; How much attention players 2 and 3 draw: 200 = enemies turn on them twice as readily (100 = the game's normal)
FocusOnPlayer2=100
; Chance (%) that an enemy which lands a hit on the player it is after stays on that player for its next attack
;   (0 = the game's normal: enemies move on to someone else after almost every attack; 100 = always stays)
StayOnHitChance=0
; An enemy turns on a player who deals it this much damage within a few seconds (% of its max health), 0 = off
TurnOnHeavyDamage=0
; Enemies go after a weakened player: when an enemy picks a new target, the chance it goes for the weakest player
;   instead - Off (the game's normal), Low (25%), Medium (50%), High (75%), Extreme (always)
PreferWeakTargets=Off
; A player counts as weakened below this much of their max health (%): 20 = below a fifth, 50 = below half
WeakTargetHealth=20
MenuSlowdown=100
MenuSlowdownPlayer2=100
MenuSlowdownPlayer3=100

[Player1]
; (player 1's controller: [Input2] Seat1 - the keyboard always works for player 1 too)

[Player2]
; (player 2's controller: [Input2] Seat2)
; 1 = holding JoinButton on this player's controller for 1 second joins / leaves
;   (0 = keyboard key / join at start only)
JoinWithController=1
JoinButton=Start
; 1 = if player 2's controller disconnects, the AI takes over after 3 seconds, and player 2
;   gets the character back as soon as the controller returns
AutoLeaveOnDisconnect=1
; Left stick dead zone, 0.0 - 0.9
MoveDeadzone=0.24
; Controller rumble when this player's character is hit, in % (0 = off, 200 = strongest)
Rumble=100
; Their window's camera (split screen), behind them and turning with them; their left stick moves relative to it.
;   Distance / Height = how far behind / above, Pitch = look-down angle, TurnSpeed = how quickly it follows.
;   Right stick: WindowCameraControl 1 = turns it (a flick switches targets while locked on), speed in degrees per
;   second, AutoFollowDelay = seconds before it swings back (0 = never).
WindowDistance=260
WindowHeight=60
WindowPitch=20
WindowFOV=80
WindowTurnSpeed=3
WindowCameraControl=1
WindowCameraSpeed=150
WindowAutoFollowDelay=3
; 1 = up/down on the right stick inverted
InvertY=0
; Button icons in this player's menus and palette: Auto (PlayStation icons for a PlayStation controller, else Xbox),
;   PlayStation, Xbox, or Default (original game behavior) = the icons of player 1's device for everyone
ButtonIcons=Auto
; This player's color (reticle, badge, pointer, window frame): Default (player 2 green, player 3 orange), Green, Orange,
;   Yellow, Purple, Pink or Red (blue is player 1's)
Color=Default
; Battle buttons (PS4 layout: Square attack, Circle dodge, R1 guard, Triangle ability,
;   Cross command menu, R3 lock on - shown here with Xbox names: X B RB Y A R3)
Attack=X
Dodge=B
Guard=RB
Ability=Y
CommandMenu=A
LockOn=R3
; Their turn in player 1's command menu while they lead (the left stick also moves the cursor).
;   Their own command menu uses D-pad / A / B.
MenuUp=DPadUp
MenuDown=DPadDown
MenuConfirm=A
MenuBack=B
MenuPreviousCharacter=LB, LT
MenuNextCharacter=RB, RT
; Shortcut palette: hold ShortcutHold, then press the button for a slot (1-4).
;   While ShortcutHold is held, the slot buttons don't attack/dodge/etc.
;   If the slots come out in the wrong order, swap the buttons below.
ShortcutHold=LB
Shortcut1=X
Shortcut2=Y
Shortcut3=B
Shortcut4=A
; Team controls (like the PS4 layout): L2 / R2 open the command page of a teammate the AI
;   is playing (never another person's), D-pad up / down switch to playing a different AI teammate.
AllyCommand1=LT
AllyCommand2=RT
SwitchCharacterPrevious=DPadUp
SwitchCharacterNext=DPadDown

[Player3]
; Player 3 works like player 2 (their controller: [Input2] Seat3 - Seat3=None switches player 3
;   off: the AI plays the 3rd party member).
; Keyboard key that makes player 3 join or leave, and whether they're in when the game starts
;   (Auto / 0 - see JoinAtStart in [General]). Not F11: the game uses F11 to switch windowed / fullscreen
JoinKey=Ctrl+F10
JoinAtStart=Auto
; 1 = holding JoinButton on this player's controller joins / leaves (0 = keyboard key / join at start only)
JoinWithController=1
JoinButton=Start
AutoLeaveOnDisconnect=1
MoveDeadzone=0.24
; Controller rumble when this player's character is hit, in % (0 = off, 200 = strongest)
Rumble=100
; Their window's camera (split screen), behind them and turning with them; their left stick moves relative to it.
;   Distance / Height = how far behind / above, Pitch = look-down angle, TurnSpeed = how quickly it follows.
;   Right stick: WindowCameraControl 1 = turns it (a flick switches targets while locked on), speed in degrees per
;   second, AutoFollowDelay = seconds before it swings back (0 = never).
WindowDistance=260
WindowHeight=60
WindowPitch=20
WindowFOV=80
WindowTurnSpeed=3
WindowCameraControl=1
WindowCameraSpeed=150
WindowAutoFollowDelay=3
; 1 = up/down on the right stick inverted
InvertY=0
; Button icons in this player's menus and palette: Auto (PlayStation icons for a PlayStation controller, else Xbox),
;   PlayStation, Xbox, or Default (original game behavior) = the icons of player 1's device for everyone
ButtonIcons=Auto
; This player's color (reticle, badge, pointer, window frame): Default (player 2 green, player 3 orange), Green, Orange,
;   Yellow, Purple, Pink or Red (blue is player 1's)
Color=Default
Attack=X
Dodge=B
Guard=RB
Ability=Y
CommandMenu=A
LockOn=R3
MenuUp=DPadUp
MenuDown=DPadDown
MenuConfirm=A
MenuBack=B
MenuPreviousCharacter=LB, LT
MenuNextCharacter=RB, RT
ShortcutHold=LB
Shortcut1=X
Shortcut2=Y
Shortcut3=B
Shortcut4=A
AllyCommand1=LT
AllyCommand2=RT
SwitchCharacterPrevious=DPadUp
SwitchCharacterNext=DPadDown

[Input2]
; Which controller each player uses: Keyboard, None, Auto, or a controller's model number
;   VID:PID as the settings app shows it (e.g. 054C:0CE6 = DualSense, 0D22:0C34 = msi GC30).
;   Two controllers of the same model: 045E:028E#1 and 045E:028E#2.
; Auto = the first free gamepad (never a wheel, pedals or a flight stick). Seats are filled in
;   order, so with one controller player 1 gets it. A player keeps their controller when it is
;   unplugged and plugged in again.
; Player 1 always has the keyboard as well; Seat1=Keyboard = player 1 on the keyboard only.
; Seat3=None switches player 3 off.
Seat1=Auto
Seat2=Auto
Seat3=Auto
; XInput = the game only ever sees the party leader's controller (leave it like this)
GameInput=XInput

; A controller whose buttons come out wrong (some generic controllers): its own button map, by
;   model number - the settings app writes it when you set the buttons. By hand, e.g.:
; [Pad.0D22:0C34]
; Name=msi GC30 V2
; A=1
; B=2
;   ... X Y LB RB LT RT Back Start LS RS = the button numbers Windows shows (1 = first),
;   LeftX LeftY RightX RightY = X Y Z Rx Ry Rz Slider1 Slider2 (the stick axes)

; ---- f1.272: the enemy / command menu settings used for ANY number of people when [Balance] DynamicDifficulty=0 ----
[BalanceGlobal]
MenuSlowdown=100
MenuSlowdownPlayer2=100
MenuSlowdownPlayer3=100
EnemyHP=100
StaggerRate=100
EnemyDamage=100
EnemyAttackRate=100
StayOnHitChance=0
TurnOnHeavyDamage=0
PreferWeakTargets=Off
WeakTargetHealth=20
FocusOnPlayer2=100
Player1Rates=100
Player2Rates=100
Player3Rates=100

[Profile]
; Shown by the settings app's Profiles list (ReadOnly=1: the app can't overwrite or delete it).
Name=Vanilla
Description=The normal game for any number of players: players 2 and 3 get the same ATB speed and menu slowdown as player 1. Best for casual or new players - likely easier than a single-player run. Every other setting goes back to the mod's default (your controller choices stay).
ReadOnly=1
